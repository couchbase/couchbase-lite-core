on:
  workflow_call: # So it can be used by our other repos
    inputs:
      assignee:
        description: "GitHub username to assign to the PR (optional)"
        required: false
        type: string
      reviewer:
        description: "DEPRECATED: alias for assignee, use assignee instead"
        required: false
        type: string
  pull_request: # And also be used for itself
    types: [opened]
    branches: ["release/**"]
    paths:
      - "C/**"
      - "Crypto/**"
      - "LiteCore/**"
      - "MSVC/**"
      - "Networking/**"
      - "Replicator/**"
      - "REST/**"
      - "vendor/fleece"

  workflow_dispatch: # manual trigger via GitHub UI

jobs:
  warn-release:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `This is a release branch and commits are restricted.

            Please confirm this PR is one of the following:

            - [ ] A response to a customer ask
            - [ ] An approved backport
            - [ ] A non-functional change (e.g. changes needed for building an older version)
            - [ ] A bug fix for a x.y.0 release
            - [ ] A change that has been granted an exception (please comment)`
            })
      - uses: actions/github-script@v7
        if: ${{ inputs.assignee != '' || inputs.reviewer != '' }}
        env:
          ASSIGNEE: ${{ inputs.assignee }}
          REVIEWER: ${{ inputs.reviewer }}
        with:
          script: |
            if (process.env.REVIEWER) {
              core.warning("The 'reviewer' input is deprecated and is now an alias for 'assignee'. Please switch to 'assignee'.");
            }
            const assignee = process.env.ASSIGNEE || process.env.REVIEWER;
            await github.rest.issues.addAssignees({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              assignees: [assignee]
            })
